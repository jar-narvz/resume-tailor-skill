name: Tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex fonts-texgyre poppler-utils
      - name: Install Python dependencies
        run: python -m pip install pyyaml pikepdf
      - name: Diagnose TeX and font lookup
        run: |
          xelatex --version
          kpsewhich texgyretermes-regular.otf
      - name: Run tests
        env:
          RESUME_TAILOR_REQUIRE_TEX: '1'
        run: python -m unittest discover -s tests -v
