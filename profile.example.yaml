# profile.example.yaml: a blank starting point for user/profile.yaml.
# First-time setup (references/setup.md) fills this in from your resume, so
# you rarely need to write it by hand. See examples/profile.yaml for a
# complete, working example (Alex Rivera, a made-up person).

name: Your Name

# Rendered in this order, separated by " | ". A label with no url is plain text.
# The cover letter skips a plain location; add `letter: false` to skip others.
contact:
  - {label: linkedin.com/in/yourname, url: "https://www.linkedin.com/in/yourname/"}
  - {label: you@example.com, url: "mailto:you@example.com"}
  - {label: github.com/yourname, url: "https://github.com/yourname"}
  - {label: "(555) 555-5555"}
  - {label: "City, ST"}

education:
  - school: Your University
    degree: "Bachelor's Degree in Computer Science"
    graduation: May 2027              # printed on the resume; the build checks for it
    graduation_prefix: "Expected Graduation:"
    alt_graduations: []               # other dates a plan may pick, e.g. ["December 2027"]
    coursework: [Data Structures, Algorithms]

font: termes                          # termes | times-system

drive_masters: []                     # optional Google Doc master(s) to check for edits

variants:
  swe:
    label: Software engineering
    use_for: "SWE, backend, full-stack"
    section_order: [education, experience, projects, skills]
    experience:
      - slot: company                 # short lowercase name; bullet IDs use it (company-1)
        title: Software Engineering Intern
        dates: "June 2026 -- August 2026"
        org: Company Name
        org_url: ""
        location: "City, ST"
        default_bullets: [company-1, company-2]
    default_projects:
      proj-example: [example-1, example-2]
    default_skills:
      Languages: [Python, Java]
      Frameworks & Tools: [Git]
